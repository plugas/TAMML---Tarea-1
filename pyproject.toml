[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "tamml-tarea-1"
version = "0.1.0"
description = "Asistente virtual corporativo de Riopaila Castilla — Q&A con LangChain + Groq + Streamlit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-groq>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "selenium>=4.0",
    "webdriver-manager>=4.0",
    "pdfplumber>=0.11",
    "pandas>=2.0",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-postgres>=0.0.9",
    "psycopg[binary]>=3.1",
    "tiktoken>=0.7",
    "vecs>=0.4",
    "supabase==2.3.8",
    "httpx>=0.24,<0.26",
    "gotrue>=2.4,<2.5",
    "pymupdf4llm>=1.27.2.3",
    "markdown-it-py>=3.0",
    "fpdf2>=2.8.7",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.scripts]
app = "run_app:main"
api = "riopaila_rag.api.main:run"
